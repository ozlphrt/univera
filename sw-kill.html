<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clearing Cache...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4A90E2;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Clearing cache and service workers...</h2>
    <p>Redirecting to the app...</p>
  </div>
  <script>
    (function() {
      'use strict';
      var cleared = false;
      
      function clearEverything() {
        if (cleared) return;
        cleared = true;
        
        // Unregister ALL service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            var unregisterPromises = registrations.map(function(registration) {
              return registration.unregister().then(function(success) {
                console.log('Service worker unregistered:', success);
                return success;
              });
            });
            
            return Promise.all(unregisterPromises);
          }).then(function() {
            // Clear all caches
            if ('caches' in window) {
              return caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) {
                  return caches.delete(name);
                }));
              });
            }
          }).then(function() {
            console.log('✅ All service workers and caches cleared');
            // Redirect to main app with cache-busting
            var baseUrl = window.location.origin + '/univera/';
            var redirectUrl = baseUrl + '?v=' + Date.now() + '&nocache=1&_sw=cleared';
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
          }).catch(function(error) {
            console.error('Error clearing cache:', error);
            // Still redirect even if there's an error
            setTimeout(function() {
              var baseUrl = window.location.origin + '/univera/';
              window.location.href = baseUrl + '?v=' + Date.now() + '&nocache=1';
            }, 1000);
          });
        } else {
          // No service worker support, just redirect
          setTimeout(function() {
            var baseUrl = window.location.origin + '/univera/';
            window.location.href = baseUrl + '?v=' + Date.now() + '&nocache=1';
          }, 500);
        }
      }
      
      // Run immediately
      clearEverything();
      
      // Also run after a short delay as backup
      setTimeout(clearEverything, 100);
    })();
  </script>
</body>
</html>
