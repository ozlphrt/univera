    <script>
      // CRITICAL: Block service workers completely
      (function() {
        if ('serviceWorker' in navigator) {
          // Override register to prevent any registration
          var originalRegister = navigator.serviceWorker.register;
          navigator.serviceWorker.register = function() {
            console.warn('[BLOCKED] Service worker registration attempted but blocked');
            return Promise.reject(new Error('Service workers are disabled'));
          };
          
          // Immediately unregister all existing service workers
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length > 0) {
              console.log('[CLEAR] Unregistering', registrations.length, 'service workers');
              Promise.all(registrations.map(function(reg) {
                return reg.unregister();
              })).then(function() {
                console.log('[CLEAR] All service workers unregistered');
                // Clear all caches
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    Promise.all(names.map(function(name) {
                      return caches.delete(name);
                    })).then(function() {
                      console.log('[CLEAR] All caches cleared');
                      // Reload to get fresh content
                      if (!window.location.search.includes('reloaded')) {
                        window.location.href = window.location.href.split('?')[0] + '?reloaded=1&v=' + Date.now();
                      }
                    });
                  });
                }
              });
            }
          });
        }
      })();
    </script>
