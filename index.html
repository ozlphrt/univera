    <script>
      // CRITICAL: Run IMMEDIATELY before anything else loads
      (function() {
        'use strict';
        
        // Register self-destructing service worker FIRST
        if ('serviceWorker' in navigator) {
          // Register the self-destructing service worker
          navigator.serviceWorker.register('/univera/sw.js', { scope: '/univera/' })
            .then(function(registration) {
              console.log('✅ Self-destructing service worker registered');
              // Force update
              registration.update();
              // Wait a moment, then unregister all
              setTimeout(function() {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  registrations.forEach(function(reg) {
                    reg.unregister();
                  });
                });
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    return Promise.all(names.map(function(name) {
                      return caches.delete(name);
                    }));
                  });
                }
              }, 500);
            })
            .catch(function(error) {
              console.log('Service worker registration failed (expected if already cleared):', error);
            });
        }
        
        // Check for old bundle and redirect if found
        setTimeout(function() {
          var scripts = document.querySelectorAll('script[src*="index-"]');
          var hasOldBundle = false;
          scripts.forEach(function(script) {
            var src = script.getAttribute('src') || '';
            if (src.includes('index-BcQdPOJw.js')) {
              hasOldBundle = true;
            }
          });
          
          if (hasOldBundle) {
            console.error('❌ OLD BUNDLE DETECTED! Redirecting to kill page...');
            window.location.href = window.location.origin + '/univera/sw-kill.html';
          }
        }, 1000);
      })();
    </script>
