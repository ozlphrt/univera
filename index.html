<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/univera/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="College Guidance Made Simple" />
    <meta name="theme-color" content="#4A90E2" />
    <title>Univera — College Guidance Made Simple</title>
    <script>
      // CRITICAL: This MUST run before service worker intercepts
      // If service worker intercepts HTML, this code never runs
      // Solution: Add ?nocache=1 to URL to force bypass
      (function() {
        'use strict';
        
        // Check URL - if no cache-busting param, add it and reload
        var url = new URL(window.location.href);
        if (!url.searchParams.has('nocache') && !url.searchParams.has('v')) {
          url.searchParams.set('nocache', '1');
          url.searchParams.set('v', Date.now().toString());
          window.location.replace(url.toString());
          return; // Stop execution - page will reload
        }
        
        // STEP 1: Immediately unregister ALL existing service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length > 0) {
              console.log('[INIT] Found', registrations.length, 'service workers - unregistering...');
              Promise.all(registrations.map(function(reg) {
                return reg.unregister();
              })).then(function() {
                console.log('[INIT] ✅ All service workers unregistered');
                // Clear all caches
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    return Promise.all(names.map(function(name) {
                      return caches.delete(name);
                    }));
                  }).then(function() {
                    console.log('[INIT] ✅ All caches cleared');
                    // Reload once more to ensure fresh content
                    if (!url.searchParams.has('reloaded')) {
                      url.searchParams.set('reloaded', '1');
                      window.location.replace(url.toString());
                    }
                  });
                }
              });
            }
          });
        }
        
        // STEP 2: Check for old bundle
        setTimeout(function() {
          var scripts = document.querySelectorAll('script[src*="index-"]');
          var hasOldBundle = false;
          for (var i = 0; i < scripts.length; i++) {
            var src = scripts[i].getAttribute('src') || '';
            if (src.includes('index-BcQdPOJw.js')) {
              hasOldBundle = true;
              break;
            }
          }
          
          if (hasOldBundle) {
            console.error('[INIT] ❌ OLD BUNDLE DETECTED! Forcing reload...');
            window.location.href = window.location.origin + '/univera/?v=' + Date.now() + '&nocache=1&force=1';
          }
        }, 100);
      })();
    </script>
    <script type="module" crossorigin src="/univera/assets/index-CRvsvHbF.js"></script>

  </head>

  </body>
